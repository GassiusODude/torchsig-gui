<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TorchSig Layout Matrix</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
    <div class="max-w-5xl mx-auto bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
        <h1 class="text-2xl font-bold mb-6 border-b border-slate-700 pb-2 text-sky-400">Dataset Configuration Portal</h1>

        <form id="matrixForm" class="space-y-6">
            <!-- Global Config Row -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 p-4 bg-slate-850 rounded-lg border border-slate-700">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Dataset ID</label>
                    <input type="text" id="datasetId" value="narrowband_impaired_val_all" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Dataset Length</label>
                    <input type="number" id="datasetLength" value="114000" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Seed</label>
                    <input type="number" id="datasetSeed" value="1234567893" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Impairment Level</label>
                    <input type="number" id="impairmentLevel" value="2" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Representation</label>
                    <select id="representation" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                        <option value="iq">IQ (Time Domain)</option>
                        <option value="spectrogram">Spectrogram (Frequency Domain)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Grouping Mode</label>
                    <select id="samplingMode" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                        <option value="per_signal">Per Signal</option>
                        <option value="per_family">Per Family</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Target Labels</label>
                    <select id="targetLabels" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                        <option value="class_name">Class Name</option>
                        <option value="class_index">Class Index</option>
                    </select>
                </div>
            </div>

            <!-- EXPOSED DATASET METADATA SECTIONS -->
            <div class="p-4 bg-slate-850 rounded-lg border border-slate-700 space-y-4">
                <h2 class="text-md font-semibold text-slate-300 border-b border-slate-700 pb-1">Dataset Metadata Tuning Fields</h2>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Sample Rate (Hz)</label>
                        <input type="number" id="sampleRate" value="10000000" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">IQ Samples Count</label>
                        <input type="number" id="numIqSamples" value="4096" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">FFT Size / Stride</label>
                        <div class="flex space-x-2">
                            <input type="number" id="fftSize" value="64" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                            <input type="number" id="fftStride" value="64" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Cochannel Overlap Prob</label>
                        <input type="number" id="cochannelOverlap" value="0.0" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Signals Min / Max</label>
                        <div class="flex space-x-2">
                            <input type="number" id="numSignalsMin" value="1" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                            <input type="number" id="numSignalsMax" value="1" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">SNR Range (dB)</label>
                        <div class="flex space-x-2">
                            <input type="number" id="snrMin" value="0.0" step="0.5" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                            <input type="number" id="snrMax" value="50.0" step="0.5" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Duration Samples Range</label>
                        <div class="flex space-x-2">
                            <input type="number" id="durationMin" value="3276" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                            <input type="number" id="durationMax" value="4096" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Bandwidth Range (Hz)</label>
                        <div class="flex space-x-2">
                            <input type="number" id="bwMin" value="2500000" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                            <input type="number" id="bwMax" value="3333333" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modulation checklist segment -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-md font-semibold text-slate-300">Select Supported Modulations</h2>
                    <div class="text-xs space-x-2">
                        <button type="button" id="selectAllBtn" class="text-sky-400 hover:underline">Select All</button>
                        <span class="text-slate-600">|</span>
                        <button type="button" id="clearAllBtn" class="text-slate-400 hover:underline">Clear All</button>
                    </div>
                </div>
                <div class="border border-slate-700 rounded-lg bg-slate-900 p-4 max-h-56 overflow-y-auto">
                    <div id="checklistGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
                </div>
            </div>

            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-2.5 rounded transition duration-200 shadow-md">
                Build & Save Target Dataset Configuration
            </button>
        </form>

        <div id="statusMessage" class="mt-4 hidden p-3 rounded text-sm font-medium"></div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
